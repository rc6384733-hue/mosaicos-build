<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>MosaicOS 0.50 — Aero Desktop</title>
<link rel="stylesheet" href="assets/win7.css">
</head>
<body>

<!-- ================= BOOT ================= -->
<div id="boot-screen" class="screen">
  <div class="boot-inner">
    <div class="boot-logo">
      <span class="boot-tile t1"></span><span class="boot-tile t2"></span>
      <span class="boot-tile t3"></span><span class="boot-tile t4"></span>
      <span class="boot-name">MosaicOS</span>
    </div>
    <div class="boot-status">Iniciando MosaicOS<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    <div class="boot-bar"><span></span></div>
  </div>
  <div class="boot-foot">MosaicOS 0.50 «Aero» &nbsp;·&nbsp; © 2026 MosaicOS Project</div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login-screen" class="screen hidden">
  <div class="login-aurora"></div>
  <div class="login-brand"><span class="brand-flag"><i></i><i></i><i></i><i></i></span><span>MosaicOS</span></div>
  <div class="login-center">
    <div class="login-card">
      <div class="user-pic">M</div>
      <div class="user-name" id="login-user">Mosaic</div>
      <form id="login-form" autocomplete="off">
        <div class="pw-row">
          <input type="password" id="login-pass" placeholder="Contraseña (opcional)" aria-label="Contraseña">
          <button type="submit" id="login-go" title="Iniciar sesión">→</button>
        </div>
      </form>
      <div class="login-hint">Presione Entrar para iniciar sesión</div>
    </div>
    <div class="login-loading hidden" id="login-loading"><span class="spinner"></span><p>Preparando el escritorio…</p></div>
  </div>
  <div class="login-foot">
    <button class="login-access" id="login-access">Accesibilidad</button>
    <button class="login-power" id="login-power" title="Apagar">⏻</button>
  </div>
</div>

<!-- ================= DESKTOP ================= -->
<div id="desktop" class="hidden">
  <div id="wallpaper-layer"></div>

  <div id="desktop-icons" role="list" aria-label="Iconos del escritorio"></div>

  <div id="gadgets">
    <div class="gadget gadget-clock" id="gadget-clock">
      <div class="analog">
        <span class="hand hour"></span><span class="hand minute"></span><span class="hand second"></span>
        <span class="pin"></span>
      </div>
      <div class="digital"><span id="gadget-time">--:--</span><small id="gadget-date"></small></div>
    </div>
    <div class="gadget gadget-weather" id="gadget-weather">
      <div class="wx-top"><svg class="ico wx-ico"><use href="#i-weather"></use></svg><div><b>22°</b><small>Despejado</small></div></div>
      <div class="wx-city">Mosaic City</div>
      <div class="wx-week"><span>L 21°</span><span>M 23°</span><span>X 24°</span><span>J 22°</span></div>
    </div>
  </div>

  <div id="windows-layer"></div>
  <div id="snap-preview" class="hidden"></div>
  <div id="alt-tab" class="hidden"></div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <button id="start-button" title="Inicio (Ctrl+Esc)" aria-label="Inicio"><span class="start-orb"><span class="orb-glint"></span></span></button>
    <div id="quick-launch"></div>
    <div id="task-buttons"></div>
    <div id="tray">
      <button id="tray-show-desktop" title="Mostrar escritorio" aria-label="Mostrar escritorio"></button>
      <button class="tray-icon" id="tray-network" title="Red: conectada" aria-label="Red"><svg class="ico"><use href="#i-network"></use></svg></button>
      <button class="tray-icon" id="tray-volume" title="Volumen" aria-label="Volumen"><svg class="ico"><use href="#i-volume"></use></svg></button>
      <button id="tray-clock" title="Fecha y hora"><span id="clock-time">--:--</span><span id="clock-date"></span></button>
    </div>
    <div id="show-desktop" title="Mostrar escritorio"></div>
  </div>

  <!-- START MENU -->
  <div id="start-menu" class="hidden">
    <div class="sm-left">
      <div class="sm-programs" id="sm-programs"></div>
      <button class="sm-all" id="sm-all"><span>Todos los programas</span><span class="sm-arrow">▸</span></button>
      <div class="sm-search"><svg class="ico"><use href="#i-search"></use></svg><input id="sm-search" placeholder="Buscar programas y archivos" aria-label="Buscar"></div>
    </div>
    <div class="sm-right">
      <div class="sm-user"><span class="sm-avatar">M</span><span id="sm-username">Mosaic</span></div>
      <nav class="sm-links" id="sm-links"></nav>
      <div class="sm-power-row">
        <button id="sm-shutdown" class="sm-shutdown">Apagar</button>
        <button id="sm-power-arrow" class="sm-power-arrow" aria-label="Opciones de energía">▸</button>
      </div>
    </div>
    <div id="all-programs" class="hidden"></div>
  </div>

  <!-- flyouts, menus, overlays -->
  <div id="tray-flyout" class="hidden"></div>
  <div id="context-menu" class="hidden"></div>
  <div id="toasts"></div>
  <div id="dialog-layer"></div>

  <div id="lock-screen" class="screen hidden">
    <div class="lock-blur"></div>
    <div class="lock-user"><div class="user-pic">M</div><div class="user-name" id="lock-name">Mosaic</div><div class="lock-state">Bloqueado</div>
      <form id="unlock-form"><input type="password" id="unlock-pass" placeholder="Contraseña (opcional)" autocomplete="off"><button type="submit">→</button></form>
      <small>Presione Entrar para desbloquear</small>
    </div>
    <div class="lock-foot"><span id="lock-clock"></span><button id="lock-power">⏻</button></div>
  </div>

  <div id="power-overlay" class="hidden">
    <div class="power-box">
      <span class="spinner big"></span>
      <p id="power-text">Apagando…</p>
    </div>
  </div>
</div>

<template id="tpl-window">
  <section class="window" tabindex="-1">
    <header class="win-titlebar">
      <svg class="ico win-icon"><use href="#i-file"></use></svg>
      <span class="win-title"></span>
      <div class="win-controls">
        <button class="wc wc-min" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 12 12"><path d="M2 9h8" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button class="wc wc-max" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="wc wc-close" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
    </header>
    <div class="win-body"></div>
    <div class="win-resize n" data-dir="n"></div><div class="win-resize s" data-dir="s"></div>
    <div class="win-resize e" data-dir="e"></div><div class="win-resize w" data-dir="w"></div>
    <div class="win-resize ne" data-dir="ne"></div><div class="win-resize nw" data-dir="nw"></div>
    <div class="win-resize se" data-dir="se"></div><div class="win-resize sw" data-dir="sw"></div>
  </section>
</template>
