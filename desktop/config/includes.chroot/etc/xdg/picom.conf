# MosaicOS Aero — compositor ligero (sombras y transiciones)
backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -6;
shadow-offset-y = -6;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 12;
inactive-opacity = 0.98;
frame-opacity = 1.0;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
refresh-rate = 0;
xrender-sync-fence = true;
