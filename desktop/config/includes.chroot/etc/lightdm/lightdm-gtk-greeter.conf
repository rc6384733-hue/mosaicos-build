[greeter]
background=/usr/share/backgrounds/mosaicos/mosaic-7-login.png
theme-name=Adwaita
icon-theme-name=MosaicAero
cursor-theme-name=DMZ-White
font-name=Noto Sans 10
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb
clock-format=%H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~power
show-indicators=~host;~clock;~session;~power
