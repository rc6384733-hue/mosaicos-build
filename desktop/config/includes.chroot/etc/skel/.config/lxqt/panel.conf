[General]
__userfile__=true
panels=panel1

[panel1]
plugins=mainmenu,quicklaunch,taskbar,statusnotifier,volume,worldclock,showdesktop
position=Bottom
desktop=0
alignment=Left
iconSize=22
lineSize=40
background-color=#0b1a2b
opacity=92
font-color=#ffffff
reserve-space=true
visible-margin=true
hidable=false
lockPanel=false
animation-duration=150
width=100
width-percent=true

[mainmenu]
type=mainmenu
icon=start-here
showText=false
showSearch=true

[quicklaunch]
type=quicklaunch
alignment=Left

[taskbar]
type=taskbar
buttonWidth=210
groupingEnabled=true
closeOnMiddleClick=true

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[worldclock]
type=worldclock
alignment=Right
timeFormat=%H:%M
dateFormat=dddd d MMMM
showDate=true

[showdesktop]
type=showdesktop
alignment=Right
